# Entity: V100 Server Products (vital_stone family)
#
# The three systems built on the V100 server CPU. Aliases are model numbers
# only: board/product aliases must not collide with the V100 chip entity, or
# chip attributes would be re-checked against product pages.

entity: V100 Products
family: vital_stone
language_pair: true

aliases:
