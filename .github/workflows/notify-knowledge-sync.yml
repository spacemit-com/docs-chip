name: Notify Knowledge Sync

on:
  pull_request:
    paths:
      - "en/**/*.md"
      - "zh/**/*.md"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Get changed files
        id: changed
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            return files.map(f => f.filename).join(' ');
          result-encoding: string

      - name: Trigger knowledge-sync checker
        uses: actions/github-script@v7
        with:
          # Needs a PAT with repo scope for the knowledge-sync repo
          github-token: ${{ secrets.KNOWLEDGE_SYNC_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo:  'spacemit-knowledge-sync',
              event_type: 'docs-updated',
              client_payload: {
                source_owner: context.repo.owner,
                source_repo:  context.repo.repo,
                pr_number:    String(context.issue.number),
                changed_files: '${{ steps.changed.outputs.result }}',
              },
            });
