    The V100 server product line comprises the C2201 general-purpose computing
    server, the G5201 intelligent computing server, and the S5236 storage server,
    all built on two SpacemiT V100 RISC-V server-class processors.
  zh: >-
    V100 服务器产品线包括 C2201 计算服务器、G5201 智算服务器与 S5236 存储服务器，
    均基于两颗进迭时空 V100 RISC-V 服务器级处理器构建。

